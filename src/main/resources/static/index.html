<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <style>
      :root {
        --bg-page: #f1f5f9;
        --bg-card: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --success: #10b981;
        --success-hover: #059669;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --secondary: #64748b;
        --secondary-hover: #475569;
        --shadow-lg:
          0 10px 25px -5px rgba(15, 23, 42, 0.08),
          0 8px 10px -6px rgba(15, 23, 42, 0.04);
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text-main);
        min-height: 100vh;
        line-height: 1.5;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        background: var(--bg-card);
        padding: 32px 36px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }

      /* Header */
      .header-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        margin-bottom: 28px;
        border-bottom: 2px solid var(--bg-page);
      }

      .header-group h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.025em;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-group h2::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 24px;
        background: var(--primary);
        border-radius: 4px;
      }

      /* Form Layout */
      #studentForm {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        background-color: #f8fafc;
        padding: 24px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 0;
        display: flex;
        flex-direction: column;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #334155;
      }

      input[type="text"],
      input[type="email"] {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.95rem;
        color: var(--text-main);
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input[type="text"]:focus,
      input[type="email"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .error-message {
        color: var(--danger);
        font-size: 0.8rem;
        font-weight: 500;
        margin-top: 6px;
        min-height: 18px;
        display: block;
      }

      /* Buttons */
      button {
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      button:active {
        transform: translateY(1px);
      }

      .btn-submit {
        grid-column: 1 / -1;
        justify-self: start;
        background-color: var(--success);
        padding: 11px 24px;
        box-shadow: 0 2px 4px rgba(16, 185, 129, 0.25);
      }

      .btn-submit:hover {
        background-color: var(--success-hover);
        box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
      }

      .btn-clear {
        background-color: var(--secondary);
      }

      .btn-clear:hover {
        background-color: var(--secondary-hover);
      }

      .btn-edit {
        background-color: var(--primary);
        padding: 6px 12px;
        font-size: 0.82rem;
        margin-right: 6px;
      }

      .btn-edit:hover {
        background-color: var(--primary-hover);
      }

      .btn-delete {
        background-color: var(--danger);
        padding: 6px 12px;
        font-size: 0.82rem;
      }

      .btn-delete:hover {
        background-color: var(--danger-hover);
      }

      .btn-logout {
        background-color: #fee2e2;
        color: var(--danger);
        border: 1px solid #fecaca;
      }

      .btn-logout:hover {
        background-color: var(--danger);
        color: white;
      }

      /* Table Styling */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 10px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
      }

      th,
      td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
      }

      th {
        background-color: #f8fafc;
        color: var(--text-muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      td {
        font-size: 0.92rem;
        color: #1e293b;
      }

      tbody tr {
        transition: background-color 0.15s ease;
      }

      tbody tr:hover {
        background-color: #f8fafc;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      /* Responsive Adjustments */
      @media (max-width: 768px) {
        .container {
          padding: 20px;
        }

        #studentForm {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .btn-submit {
          width: 100%;
        }

        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-group">
        <h2>Student Management Dashboard</h2>
        <button
          type="button"
          class="btn-logout"
          id="logoutBtn"
          onclick="logoutUser()"
        >
          Logout
        </button>
      </div>

      <form id="studentForm" novalidate>
        <input type="hidden" id="studentId" />

        <div class="form-group">
          <label for="firstName">First Name:</label>
          <input
            type="text"
            id="firstName"
            placeholder="e.g., Lawrde Darryle"
            required
            minlength="2"
            maxlength="50"
          />
          <span id="firstNameError" class="error-message"></span>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name:</label>
          <input
            type="text"
            id="lastName"
            placeholder="e.g., Amancio"
            required
            minlength="2"
            maxlength="50"
          />
          <span id="lastNameError" class="error-message"></span>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="e.g., lawrde.amancio@gmail.com"
            required
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          />
          <span id="emailError" class="error-message"></span>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Add Student
        </button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
    <script src="validation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
